plugins {
	id 'java'
	//id 'org.springframework.boot' version '3.2.0'
	id 'org.springframework.boot' version '2.7.14'
	//id 'io.spring.dependency-management' version '1.1.4'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
	// queryDSL 추가
	//id "com.ewerk.gradle.plugins.querydsl" version "1.0.10"
}

group = 'com.soon.board'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' } /* 아임포트 결제관련 */
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation group: 'commons-io', name: 'commons-io', version: '2.11.0'
	implementation group: 'commons-fileupload', name: 'commons-fileupload', version: '1.3.3'
	//implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.0'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'       /* Thymeleaf Layout */
	implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'  /* Log4JDBC */
	implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.11.5'
	implementation group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.5'
	implementation group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.5'
	// Querydsl 추가
	//implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	implementation 'com.querydsl:querydsl-jpa:5.0.0'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jpa'
	//annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
	//annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jpa"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	implementation 'com.github.iamport:iamport-rest-client-java:0.2.21' /* 아임포트 결제관련 */
	// https://mvnrepository.com/artifact/com.oracle.oci.sdk/oci-java-sdk-common-httpclient-jersey
	implementation group: 'com.oracle.oci.sdk', name: 'oci-java-sdk-common-httpclient-jersey', version: '3.31.1'
	// https://mvnrepository.com/artifact/com.oracle.oci.sdk/oci-java-sdk-audit
	implementation group: 'com.oracle.oci.sdk', name: 'oci-java-sdk-audit', version: '3.31.1'	
	// https://mvnrepository.com/artifact/com.oracle.oci.sdk/oci-java-sdk-core
	implementation group: 'com.oracle.oci.sdk', name: 'oci-java-sdk-core', version: '3.31.1'
	// https://mvnrepository.com/artifact/com.oracle.oci.sdk/oci-java-sdk-database
	implementation group: 'com.oracle.oci.sdk', name: 'oci-java-sdk-database', version: '3.31.1'
	// https://mvnrepository.com/artifact/com.oracle.oci.sdk/oci-java-sdk-objectstorage
	implementation group: 'com.oracle.oci.sdk', name: 'oci-java-sdk-objectstorage', version: '3.31.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

// queryDSL 추가 : QueryDSL 빌드 옵션
def querydslDir = "build/generated/querydsl"

//clean {
   //delete file(querydslDir)
//}

//querydsl {
	//jpa = true
	//querydslSourcesDir = querydslDir
//}

//sourceSets {	// IDE의 소스 폴더에 자동으로 넣어준다.
	//main.java.srcDir querydslDir
//}

//configurations {
	//querydsl.extendsFrom compileClasspath	// 컴파일이 될때 같이 수행
//}

compileQuerydsl {
	options.annotationProcessorPath = configurations.querydsl	// Q파일을 생성해준다.
}

